# Bounded first physical movement sequence for the Lite3.
# Every step passes only on telemetry evidence. Any failure stops the sequence;
# a velocity failure is followed by zeros and verified rest. Changing this file
# changes its sha256, which invalidates any physical authorization for it.
name: lite3_basic_bounded_walk
description: >
  Readiness, telemetry contract, rest, stand (only from verified lying), verified
  standing, one slow forward move, verified stop, then return to lying.

telemetry:
  min_rate_hz: 50.0           # bridge publishes 200 Hz; rclpy here processes ~110 Hz
  max_age_s: 0.25
  required_sensor_alive: [imu, joint, odom2]   # existing vendor sensor_checker
  max_handle_axis: 0.05       # any remote stick input = operator takeover

safety:
  geofence_radius_m: 0.5      # odometry distance from the start of each move
  max_tilt_rad: 0.35
  command_period_s: 0.05      # 20 Hz, as in the supervised trials
  zero_seconds: 2.0
  stop_timeout_s: 6.0
  stop_hold_s: 1.5

posture:                      # hip-to-foot distance from |knee| and URDF link lengths
  lying_max_extension_m: 0.14 # live lying sample: 0.08 m on all four legs
  standing_min_extension_m: 0.22
  max_leg_spread_m: 0.06
  max_tilt_rad: 0.20
  settled_joint_range_rad: 0.05

stationary:                   # live rest noise: odom <=0.015 m/s, joints <0.001 rad
  max_planar_speed_m_s: 0.04
  max_yaw_rate_rad_s: 0.05
  max_joint_range_rad: 0.05
  max_position_change_m: 0.02
  max_gyro_rad_s: 0.15

steps:
  - id: readiness
    type: readiness
    timeout_s: 10
    quiet_s: 2.0
  - id: telemetry_contract
    type: telemetry_validation
    timeout_s: 5
    window_s: 2.0
  - id: initial_rest
    type: stationary_check
    timeout_s: 6
    hold_s: 2.0
  - id: stand
    type: posture_transition   # one toggle, only from verified lying; skipped if already standing
    target: standing
    timeout_s: 12
    hold_s: 1.5
  - id: verify_standing
    type: posture_check
    expect: standing
    timeout_s: 8
    hold_s: 2.0
  - id: forward_short
    type: velocity_move
    vx: 0.03                   # previously reviewed commissioning speed
    wz: 0.0
    duration_s: 2.0
    warmup_s: 0.5
    settle_s: 1.0
    expect:
      forward_m: [0.03, 0.15]  # >=50% of commanded 0.06 m, bounded overshoot
      lateral_m: [-0.08, 0.08]
      yaw_change_rad: [-0.20, 0.20]
  - id: stop_after_forward
    type: stop_verify
    timeout_s: 6
    hold_s: 1.5
    zero_min_s: 1.0

finalize:                      # runs only if commands were sent and state is verified
  - id: lie_down
    type: posture_transition
    target: lying
    timeout_s: 12
    hold_s: 1.5
