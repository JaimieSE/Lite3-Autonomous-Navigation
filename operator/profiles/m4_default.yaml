# M4 sensor-driven proximity stop: the defaults, written out (operator/run_physical.sh --profile).
# Every value is checked against the hard limits in lite3_movement_tests/config.py; a value outside
# them is REFUSED, never clamped. The command line overrides any value here.
# Not settable here on purpose: the trigger boundary itself (fixed when navigation starts, from
# start_navigation.sh --clearance and the measured latency/coast), the 0.30 m backup lock and the
# hard floors.
description: Defaults - 0.05 m/s, up to 1.5 m, obstacle anywhere up to 2 m ahead
m4:
  approach_speed: 0.05      # m/s            [0.02-0.05]
  max_travel: 1.5           # m              [0.2-1.8]
  max_duration: 40          # s              [5-60]   (default travel/speed + 10)
  detection_range: 2.0      # m ahead of the nose, validated region [0.5-2.5]
  max_sensor_age: 0.30      # s              [0.10-0.50]
  min_lidar_hz: 8           # Hz             [8-20]
  detect_scans: 3           # scans to confirm an obstacle [2-10]
  track_tolerance: 0.15     # m              [0.05-0.25]
  lost_track_scans: 3       # scans          [1-5]
  suppression_proof: 1.0    # s              [0.5-1.5]
  response_limit: 0.30      # s              [0.10-0.50]
  # min_clearance: 0.15     # m; default = navigation --clearance
