# Stricter detection confidence and freshness (e.g. to qualify the LiDAR link after a change).
# Expect more SAFETY_ABORT outcomes on a marginal link: that is the point.
description: Strict sensing - fresher data, more confirming scans, tighter tracking
m4:
  approach_speed: 0.05
  max_travel: 1.5
  max_sensor_age: 0.20
  min_lidar_hz: 9.5
  detect_scans: 4
  track_tolerance: 0.10
  lost_track_scans: 2
  response_limit: 0.20
